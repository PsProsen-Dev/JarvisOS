<?xml version="1.0" encoding="utf-8"?>
<Playbook>
    <Name>JarvisOS⚡</Name>
    <Username>PsProsen-Dev</Username>
    <Title>JarvisOS⚡</Title>
    <ShortDescription>The Ultimate Windows Playbook. One OS. Five Modes.</ShortDescription>
    <Description>Built for Gamers, Engineered for Developers, Optimized for Everyone.</Description>
    <Details>JarvisOS: The Ultimate Windows Playbook. One OS. Five Modes. Built for Gamers, Engineered for Developers, Optimized for Everyone. Combines ReviOS + AtlasOS + Privacy+ + NOVA into a single production-grade playbook. Built by PsProsen-Dev @ WeDigitalMitra.</Details>
    <Version>11.06.26</Version>
    <UniqueId>e8ac7742-d67b-4bfa-8ea0-622b7d2d1b96</UniqueId>
    <ProgressText>Applying JarvisOS developer workstation baseline, preserving developer features, removing telemetry and bloat, and installing selected tools.</ProgressText>
    <Git>https://github.com/PsProsen-Dev/JarvisOS</Git>
    <SupportedBuilds>
        <string>22000</string>
        <string>22621</string>
        <string>22631</string>
        <string>26100</string>
        <string>26200</string>
        <string>27686</string>
    </SupportedBuilds>
    <Requirements>
        <Requirement>DefenderToggled</Requirement>
        <Requirement>NoAntivirus</Requirement>
        <Requirement>NoTweakware</Requirement>
    </Requirements>
    <Software>
        <Package Option="browser-brave" DefaultWebBrowser="true">
            <Name>brave</Name>
            <Title>Brave</Title>
            <Description>Privacy focused browser, configured by AME for optimal usability.</Description>
            <Icon>brave.png</Icon>
        </Package>
        <Package Option="browser-librewolf" DefaultWebBrowser="true">
            <Name>librewolf</Name>
            <Title>LibreWolf</Title>
            <Description>Privacy focused browser, configured by AME for optimal usability.</Description>
            <Icon>librewolf.png</Icon>
        </Package>
        <Package Option="browser-zen" DefaultWebBrowser="true">
            <Name>zenbrowser</Name>
            <Title>Zen Browser</Title>
            <Description>Privacy-first Firefox-based browser, fast and highly customizable.</Description>
            <Icon>firefox.png</Icon>
        </Package>
        <Package Option="browser-browseros" DefaultWebBrowser="true">
            <Name>browseros</Name>
            <Title>BrowserOS</Title>
            <Description>AI-first web browser combining the power of an OS with the web.</Description>
            <Icon>edge.png</Icon>
        </Package>
        <Package Option="office-onlyoffice">
            <Name>onlyoffice</Name>
            <Title>OnlyOffice</Title>
            <Description>Powerful open-source office suite, supporting proprietary file formats.</Description>
            <Icon>onlyoffice.png</Icon>
        </Package>
        <Package Option="office-libreoffice">
            <Name>libreoffice</Name>
            <Title>LibreOffice</Title>
            <Description>Open-source MS Office alternative, supporting proprietary file formats.</Description>
            <Icon>libreoffice.png</Icon>
        </Package>
        <Package Option="office-freeoffice">
            <Name>freeoffice</Name>
            <Title>FreeOffice</Title>
            <Description>Closed-source free MS Office alternative, supporting proprietary file formats.</Description>
            <Icon>freeoffice.png</Icon>
        </Package>
    </Software>

    <FeaturePages>

        <!-- SCREEN 1: Browser -->
        <CheckboxPage Description="Please select the web browsers you would like to install. You can select multiple.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Brave Browser</Text>
                    <Name>browser-brave</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>LibreWolf</Text>
                    <Name>browser-librewolf</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Zen Browser</Text>
                    <Name>browser-zen</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>BrowserOS (Next-Gen AI OS Browser)</Text>
                    <Name>browser-browseros</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <!-- SCREEN 2: Defender -->
        <RadioPage DefaultOption="defender-enable" Description="Disabling Windows Defender can improve system performance, but at the cost of security.">
            <Options>
                <RadioOption>
                    <Text>Keep Defender (Default)</Text>
                    <Name>defender-enable</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Remove Microsoft Defender (Advanced)</Text>
                    <Name>defender-disable</Name>
                </RadioOption>
            </Options>
        </RadioPage>

        <!-- SCREEN 3: Hibernate -->
        <RadioPage DefaultOption="hibernate-disable" Description="Disabling frees disk space and prevents dual-boot or upgrade instability. This includes Fast Startup.">
            <Options>
                <RadioOption>
                    <Text>Disable Hibernate (Default)</Text>
                    <Name>hibernate-disable</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Keep Hibernate</Text>
                    <Name>hibernate-keep</Name>
                </RadioOption>
            </Options>
        </RadioPage>

        <!-- SCREEN 4: Windows Search -->
        <RadioPage DefaultOption="search-keep" Description="Windows Search indexes your files for fast search. Disabling saves RAM and CPU but breaks Start Menu search.">
            <Options>
                <RadioOption>
                    <Text>Keep Windows Search (Default)</Text>
                    <Name>search-keep</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Disable Windows Search (Advanced)</Text>
                    <Name>search-disable</Name>
                </RadioOption>
            </Options>
        </RadioPage>

        <!-- SCREEN 5: Components to Remove -->
        <CheckboxPage Description="Please select which components you would like to include or exclude with this Playbook.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Remove Microsoft Edge</Text>
                    <Name>remove-edge</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Remove OneDrive</Text>
                    <Name>remove-onedrive</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Remove AI (Recall, Copilot)</Text>
                    <Name>remove-ai-recall</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Remove Microsoft Teams</Text>
                    <Name>remove-teams</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <!-- SCREEN 6: UWP Appx Packages -->
        <CheckboxPage Description="Please select which UWP Appx packages you would like to remove.">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Remove MS Photos</Text>
                    <Name>remove-photos</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Remove Dev Home</Text>
                    <Name>remove-devhome</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Remove Xbox Apps</Text>
                    <Name>remove-xbox</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Remove Your Phone (Link to Windows)</Text>
                    <Name>remove-yourphone</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <!-- SCREEN 7: Office Suite -->
        <RadioImagePage DefaultOption="office-onlyoffice" Description="Choose your preferred office suite.">
            <Options>
                <RadioImageOption None="true"/>
                <RadioImageOption>
                    <Text>OnlyOffice</Text>
                    <Name>office-onlyoffice</Name>
                    <FileName>onlyoffice</FileName>
                    <GradientTopColor>#d9d6d6</GradientTopColor>
                    <GradientBottomColor>#ebc2b5</GradientBottomColor>
                </RadioImageOption>
                <RadioImageOption>
                    <Text>LibreOffice</Text>
                    <Name>office-libreoffice</Name>
                    <FileName>libreoffice</FileName>
                    <GradientTopColor>#d8d6d6</GradientTopColor>
                    <GradientBottomColor>#84b994</GradientBottomColor>
                </RadioImageOption>
                <RadioImageOption>
                    <Text>FreeOffice</Text>
                    <Name>office-freeoffice</Name>
                    <FileName>freeoffice</FileName>
                    <GradientTopColor>#d8d6d6</GradientTopColor>
                    <GradientBottomColor>#ecd09a</GradientBottomColor>
                </RadioImageOption>
            </Options>
        </RadioImagePage>

        <!-- SCREEN 8: Developer Tools (Part 1) -->
        <CheckboxPage Description="Developer tools — Part 1 (Core)">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Install Git</Text>
                    <Name>install-git</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Install VS Code</Text>
                    <Name>install-vscode</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Install Node.js LTS</Text>
                    <Name>install-nodejs</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Install Python 3</Text>
                    <Name>install-python</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <!-- SCREEN 8b: Developer Tools (Part 2) -->
        <CheckboxPage Description="Developer tools — Part 2 (Terminal &amp; WSL)">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Install PowerShell 7</Text>
                    <Name>install-powershell7</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Install Windows Terminal</Text>
                    <Name>install-windows-terminal</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Enable WSL2</Text>
                    <Name>install-wsl2</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <!-- SCREEN 9: AI Tools -->
        <CheckboxPage Description="AI and local LLM tools for developers and AI builders.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Install Ollama (Local LLM Runner)</Text>
                    <Name>install-ollama</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Install CUDA Toolkit (NVIDIA GPU only)</Text>
                    <Name>install-cuda</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <!-- SCREEN 10: Maintenance Tools -->
        <CheckboxPage Description="Maintenance and diagnostic utilities.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Install Privacy+ Settings</Text>
                    <Name>install-privacy-settings</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Install App Fetch</Text>
                    <Name>install-appfetch</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Install AtlasOS Toolbox</Text>
                    <Name>install-atlas-toolbox</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Install Revision Tool</Text>
                    <Name>install-revision-tool</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <!-- SCREEN 11: Optional Apps -->
        <CheckboxPage Description="Optional everyday applications.">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Install NanaZip (Modern Archiver)</Text>
                    <Name>install-nanazip</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Install VLC Media Player</Text>
                    <Name>install-vlc</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Install Thunderbird Email</Text>
                    <Name>install-thunderbird</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>



        <!-- SCREEN 12: OS Profile (4 Modes — AME max) -->
        <RadioPage IsRequired="true" DefaultOption="profile-dev" Description="Select the primary use case for this OS. Each mode optimizes Windows for a specific workflow.">
            <Options>
                <RadioOption>
                    <Text>🎮 Gaming — Max FPS, low latency, QoS for esports</Text>
                    <Name>profile-gaming</Name>
                </RadioOption>
                <RadioOption>
                    <Text>💻 Developer — Clean workstation, no gaming bloat</Text>
                    <Name>profile-dev</Name>
                </RadioOption>
                <RadioOption>
                    <Text>🎬 Creator — Streaming, video editing, Pro Audio priority</Text>
                    <Name>profile-creator</Name>
                </RadioOption>
                <RadioOption>
                    <Text>🔒 Privacy — Maximum telemetry block, zero cloud sync</Text>
                    <Name>profile-privacy</Name>
                </RadioOption>
            </Options>
        </RadioPage>

        <!-- SCREEN 13: Security (Bitdefender) -->
        <CheckboxPage Description="Antivirus and security software. Bitdefender Total Security is bundled offline - no internet needed.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Install Bitdefender Total Security (Bundled Offline)</Text>
                    <Name>install-bitdefender</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <!-- SCREEN 13: Enhanced Security (Unix-style sudo UAC) -->
        <CheckboxPage Description="Select security model. Enhanced Security requires your own password on UAC prompts (like Linux sudo). The built-in Administrator account stays disabled.">
            <TopLine Text="Recommended: Enhanced Security protects against 94% of privilege escalation attacks!"/>
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Enhanced Security — UAC requires your password</Text>
                    <Name>security-enhanced</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <!-- SCREEN 14: JarvisOS Deep Configuration -->
        <RadioPage IsRequired="true" DefaultOption="mitigations-default" Description="[JarvisOS] Disabling mitigations reduces security, and could harm performance on modern CPUs.">
            <TopLine Text="Disabling could improve performance on older CPUs."/>
            <Options>
                <RadioOption>
                    <Text>Default Windows Mitigations (recommended)</Text>
                    <Name>mitigations-default</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Disable All Mitigations</Text>
                    <Name>mitigations-disable</Name>
                </RadioOption>
            </Options>
        </RadioPage>
        <RadioPage IsRequired="true" DefaultOption="auto-updates-disable" Description="[JarvisOS] Updates are important for security, you'll get update notifications regardless.">
            <Options>
                <RadioOption>
                    <Text>Disable Automatic Windows Updates</Text>
                    <Name>auto-updates-disable</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Enable Automatic Windows Updates</Text>
                    <Name>auto-updates-default</Name>
                </RadioOption>
            </Options>
        </RadioPage>
        <CheckboxPage IsRequired="true" Description="[JarvisOS] Select the performance options you would like to use.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Disable Hibernation</Text>
                    <Name>disable-hibernation</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Maximum Performance (Disable Power Saving)</Text>
                    <Name>disable-power-saving</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Disable Core Isolation</Text>
                    <Name>disable-core-isolation</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage IsRequired="true" Description="[JarvisOS] Select the cleanup options you would like to use.">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Remove Snipping Tool App</Text>
                    <Name>remove-snipping-tool</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Remove Microsoft Edge</Text>
                    <Name>uninstall-edge</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <!-- JarvisOS Core mapping -->
        <CheckboxPage Description="[JarvisOS] Internal core options mapped for compatibility (Do not change unless necessary)">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>JarvisOS Toolbox Enable Mapping</Text>
                    <Name>install-toolbox</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <!-- SCREEN 15: JarvisOS Legacy Mapping -->
        <CheckboxPage Description="[JarvisOS] Internal options mapped for legacy compatibility (Do not change unless necessary)">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>JarvisOS Defender Disable Mapping</Text>
                    <Name>disable-defender</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>JarvisOS Hibernate Disable Mapping</Text>
                    <Name>disable-hibernate</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>JarvisOS Search Disable Mapping</Text>
                    <Name>disable-search</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>JarvisOS Revision Tool Enable Mapping</Text>
                    <Name>install-revitool</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

    </FeaturePages>
</Playbook>
