---
# JarvisOS — Bitdefender Total Security Installation
# 15_bitdefender.yml
# Installs Bitdefender Total Security silently from bundled offline installer
# Generated by Jarvis (RTX⚡) | 2026-06-01

title: Bitdefender Total Security
actions:

  - !status: {status: 'Installing Bitdefender Total Security...'}

  # =========================================================
  # Install Bitdefender Total Security
  # Bundled offline installer — no internet required
  # Silent flags: /VERYSILENT /SP- /NORESTART /NOCANCEL
  # =========================================================
  - !cmd:
      command: 'bitdefender_ts_26_64b.exe /VERYSILENT /SP- /NORESTART /NOCANCEL /SUPPRESSMSGBOXES'
      exeDir: true
      wait: true
      option: 'install-bitdefender'
      weight: 8
      status: 'Installing Bitdefender Total Security — this may take 2-3 minutes...'

  # =========================================================
  # Cleanup: Remove Bitdefender VPN
  # The offline installer bundles the VPN. We remove its desktop 
  # shortcut and attempt to uninstall it quietly.
  # =========================================================
  - !file:
      path: '%PUBLIC%\Desktop\Bitdefender VPN.lnk'
      option: 'install-bitdefender'

  - !cmd:
      command: '"%ProgramFiles%\Bitdefender\Bitdefender VPN\installer\installer.exe" /uninstall /quiet'
      ignoreErrors: true
      wait: true
      option: 'install-bitdefender'
      status: 'Removing bundled Bitdefender VPN...'

  - !status: {status: 'Bitdefender Total Security installed successfully (VPN removed)!'}
