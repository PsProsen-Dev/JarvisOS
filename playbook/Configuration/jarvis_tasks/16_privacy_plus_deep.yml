      value: 'DisableVoice'
      type: REG_DWORD
      data: '1'
      operation: add
      status: 'Disabling voice at OOBE setup...'

  # =========================================================
  # 5. PRIVACY — News, Feeds & Widgets Policy
  # =========================================================
  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\PolicyManager\default\NewsAndInterests'
      value: 'AllowNewsAndInterests'
      type: REG_DWORD
      data: '0'
      operation: add
      status: 'Killing News and Interests widget (policy)...'

  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Dsh'
      value: 'AllowNewsAndInterests'
      type: REG_DWORD
      data: '0'
      operation: add
      status: 'Killing News and Interests widget (DSH)...'

  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Feeds'
      value: 'EnableFeeds'
      type: REG_DWORD
      data: '0'
      operation: add
      status: 'Disabling Windows Feeds...'

  # =========================================================
  # 6. PRIVACY — WiFi Sense / Hotspot Reporting
  # =========================================================
  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\PolicyManager\default\WiFi\AllowWiFiHotSpotReporting'
      value: 'value'
      type: REG_DWORD
      data: '0'
      operation: add
      status: 'Disabling WiFi hotspot reporting...'

  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\PolicyManager\default\WiFi\AllowAutoConnectToWiFiSenseHotspots'
      value: 'value'
      type: REG_DWORD
      data: '0'
      operation: add
      status: 'Disabling WiFi Sense auto-connect...'

  # =========================================================
  # 7. PRIVACY — Advertising ID (Policy Layer)
  # =========================================================
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\AdvertisingInfo'
      value: 'DisabledByGroupPolicy'
      type: REG_DWORD
      data: '1'
      operation: add
      status: 'Blocking advertising ID at policy level...'

  # =========================================================
  # 8. PRIVACY — Start Menu & Explorer Extras
  # =========================================================
  - !registryValue:
      path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
