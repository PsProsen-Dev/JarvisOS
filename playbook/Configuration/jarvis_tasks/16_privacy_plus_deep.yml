      operation: add

  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Paint'
      value: 'DisableRemoveBackground'
      type: REG_DWORD
      data: '1'
      operation: add

  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\WindowsNotepad'
      value: 'DisableAIFeatures'
      type: REG_DWORD
      data: '1'
      operation: add
      status: 'Disabling Copilot in Notepad...'

  # =========================================================
  # 18. SECURITY — Adobe Reader Hardening
  #     (Applied silently; keys only active if Acrobat is installed)
  # =========================================================
  - !status: {status: 'Applying Adobe Reader security hardening...'}

  # Acrobat Reader DC
  - !registryValue:
      path: 'HKCU\SOFTWARE\Adobe\Acrobat Reader\DC\JSPrefs'
      value: 'bEnableJS'
      type: REG_DWORD
      data: '0'
      operation: add

  - !registryValue:
      path: 'HKCU\SOFTWARE\Adobe\Acrobat Reader\DC\Originals'
      value: 'bAllowOpenFile'
      type: REG_DWORD
      data: '0'
      operation: add

  - !registryValue:
      path: 'HKCU\SOFTWARE\Adobe\Acrobat Reader\DC\Originals'
      value: 'bSecureOpenFile'
      type: REG_DWORD
      data: '1'
      operation: add

  - !registryValue:
      path: 'HKCU\SOFTWARE\Adobe\Acrobat Reader\DC\Privileged'
      value: 'bProtectedMode'
      type: REG_DWORD
      data: '1'
      operation: add

  - !registryValue:
      path: 'HKCU\SOFTWARE\Adobe\Acrobat Reader\DC\TrustManager'
      value: 'iProtectedView'
      type: REG_DWORD
      data: '1'
      operation: add

  - !registryValue:
      path: 'HKCU\SOFTWARE\Adobe\Acrobat Reader\DC\TrustManager'
      value: 'bEnhancedSecurityInBrowser'
      type: REG_DWORD
      data: '1'
      operation: add

  - !registryValue:
      path: 'HKCU\SOFTWARE\Adobe\Acrobat Reader\DC\TrustManager'
      value: 'bEnhancedSecurityStandalone'
      type: REG_DWORD
      data: '1'
      operation: add

  # =========================================================
  # 19. SECURITY — Microsoft Office Hardening (2016/v16.0)
  #     (Keys only active if Office is installed)
  # =========================================================
  - !status: {status: 'Applying Office macro/DDE/ActiveX security hardening...'}

  # Word 2016
  - !registryValue:
      path: 'HKCU\SOFTWARE\Microsoft\Office\16.0\Word\Security'
      value: 'VBAWarnings'
      type: REG_DWORD
      data: '4'
      operation: add

  - !registryValue:
      path: 'HKCU\SOFTWARE\Microsoft\Office\16.0\Word\Security'
      value: 'PackagerPrompt'
      type: REG_DWORD
      data: '2'
      operation: add

  - !registryValue:
      path: 'HKCU\SOFTWARE\Microsoft\Office\16.0\Word\Security'
      value: 'AllowDDE'
      type: REG_DWORD
      data: '0'
      operation: add

  - !registryValue:
      path: 'HKCU\SOFTWARE\Microsoft\Office\16.0\Word\Options'
      value: 'DontUpdateLinks'
      type: REG_DWORD
      data: '1'
      operation: add

  # Excel 2016
  - !registryValue:
      path: 'HKCU\SOFTWARE\Microsoft\Office\16.0\Excel\Security'
      value: 'VBAWarnings'
      type: REG_DWORD
      data: '4'
      operation: add

  - !registryValue:
      path: 'HKCU\SOFTWARE\Microsoft\Office\16.0\Excel\Security'
      value: 'PackagerPrompt'
      type: REG_DWORD
      data: '2'
      operation: add

  - !registryValue:
      path: 'HKCU\SOFTWARE\Microsoft\Office\16.0\Excel\Security'
      value: 'WorkbookLinkWarnings'
      type: REG_DWORD
      data: '2'
      operation: add

  - !registryValue:
      path: 'HKCU\SOFTWARE\Microsoft\Office\16.0\Excel\Options'
      value: 'DontUpdateLinks'
      type: REG_DWORD
      data: '1'
      operation: add

  # PowerPoint 2016
  - !registryValue:
      path: 'HKCU\SOFTWARE\Microsoft\Office\16.0\PowerPoint\Security'
      value: 'VBAWarnings'
      type: REG_DWORD
      data: '4'
      operation: add

  - !registryValue:
      path: 'HKCU\SOFTWARE\Microsoft\Office\16.0\PowerPoint\Security'
      value: 'PackagerPrompt'
      type: REG_DWORD
      data: '2'
      operation: add

  # Office Common — Kill ALL ActiveX
  - !registryValue:
      path: 'HKCU\SOFTWARE\Microsoft\Office\16.0\Common\Security'
      value: 'DisableAllActiveX'
      type: REG_DWORD
      data: '1'
      operation: add

  # =========================================================
  # 20. SYSTEM — UTC Hardware Clock & NTP Server
  # =========================================================
  - !registryValue:
      path: 'HKLM\SYSTEM\CurrentControlSet\Control\TimeZoneInformation'
      value: 'RealTimeIsUniversal'
      type: REG_DWORD
      data: '1'
      operation: add
      status: 'Setting hardware clock to UTC (Linux dual-boot compatible)...'

  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\DateTime\Servers'
      value: '0'
      type: REG_SZ
      data: 'pool.ntp.org'
      operation: add
      status: 'Setting NTP server to pool.ntp.org...'

  # =========================================================
  # 21. SYSTEM — OOBE Privacy Experience Skip
  # =========================================================
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\OOBE'
      value: 'DisablePrivacyExperience'
      type: REG_DWORD
      data: '1'
      operation: add
      status: 'Skipping privacy OOBE screen...'

  # =========================================================
  # 22. DEBLOAT — Unsupported Hardware Nag & Backup Notification
  # =========================================================
  - !registryValue:
      path: 'HKCU\Control Panel\UnsupportedHardwareNotificationCache'
      value: 'SV1'
      type: REG_DWORD
      data: '0'
      operation: add
      status: 'Killing unsupported hardware warnings...'

  - !registryValue:
      path: 'HKCU\Control Panel\UnsupportedHardwareNotificationCache'
      value: 'SV2'
      type: REG_DWORD
      data: '0'
      operation: add

  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
      value: 'NoWinBackupNotifications'
      type: REG_DWORD
      data: '1'
      operation: add
      status: 'Killing Windows Backup nag notifications...'

  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\CloudContent'
      value: 'DisableCloudOptimizedContent'
      type: REG_DWORD
      data: '1'
      operation: add
      status: 'Blocking Outlook cloud pin content...'

  # =========================================================
  # 23. NETWORK — Firewall Outbound: Block Explorer.exe
  #     (SearchApp/SearchHost/StartMenu/SystemSettings already in privacy_tasks.yml)
  # =========================================================
  - !registryValue:
      path: 'HKLM\SYSTEM\ControlSet001\Services\SharedAccess\Parameters\FirewallPolicy\FirewallRules'
      value: 'Block Explorer'
      type: REG_SZ
      data: 'v2.32|Action=Block|Active=TRUE|Dir=Out|RA42=IntErnet|RA62=IntErnet|App=%SystemRoot%\explorer.exe|Name=Block Explorer|Desc=Block Explorer Outbound UDP/TCP Traffic|'
      operation: add
      status: 'Blocking Explorer.exe outbound internet access...'

  # =========================================================
  # 24. SERVICES — Extra Privacy+ Services (Safe subset)
  # =========================================================
  - !status: {status: 'Disabling extra Privacy+ services...'}

  # Cloud Identity Service
  # ⚠️ KEEP at MANUAL — needed for MS Account login in Microsoft Store & Office 365
  - !service:
      name: 'cloudidsvc'
      operation: change
      startup: 3
      status: 'Setting Cloud Identity Service to manual (MS Store compatible)...'

  # Windows AI Fabric Service
  - !service:
      name: 'WSAIFabricSvc'
