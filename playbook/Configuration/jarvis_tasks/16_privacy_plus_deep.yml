      data: '0'
      operation: add

  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Edge'
      value: 'EdgeEntraCopilotPageContext'
      type: REG_DWORD
      data: '0'
      operation: add

  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Edge'
      value: 'Microsoft365CopilotChatIconEnabled'
      type: REG_DWORD
      data: '0'
      operation: add

  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Edge'
      value: 'EdgeHistoryAISearchEnabled'
      type: REG_DWORD
      data: '0'
      operation: add

  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Edge'
      value: 'ComposeInlineEnabled'
      type: REG_DWORD
      data: '0'
      operation: add

  # =========================================================
  # 17. AI — Paint & Notepad AI Features Kill
  # =========================================================
  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Paint'
      value: 'DisableImageCreator'
      type: REG_DWORD
      data: '1'
      operation: add
      status: 'Disabling Paint AI features...'

  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Paint'
      value: 'DisableCocreator'
      type: REG_DWORD
      data: '1'
      operation: add

  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Paint'
      value: 'DisableGenerativeFill'
      type: REG_DWORD
      data: '1'
      operation: add

  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Paint'
      value: 'DisableGenerativeErase'
