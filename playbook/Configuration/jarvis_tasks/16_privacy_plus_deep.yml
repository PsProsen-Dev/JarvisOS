---
# JarvisOS — Privacy+ Deep Integration (Non-UI Tweaks Only)
# 16_privacy_plus_deep.yml
# Source: Privacy+ v0.8.2 — Unique tweaks not already in JarvisOS
# Excludes: OpenShell, themes, wallpaper, UI changes, Defender removal, Edge removal
# Generated by Jarvis (RTX⚡) | 2026-06-01
# Categories: TELEMETRY / PRIVACY / SECURITY / NETWORK / AI / PERFORMANCE / SYSTEM

title: Privacy+ Deep Hardening
privilege: TrustedInstaller
actions:

  - !status: {status: 'Applying Privacy+ Deep Hardening...'}

  # =========================================================
  # 1. TELEMETRY — Extra nodes not in 02_registry.yml
  # =========================================================

  # WOW64 node — 32-bit apps telemetry block
  - !registryValue:
      path: 'HKLM\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Policies\DataCollection'
      value: 'AllowTelemetry'
      type: REG_DWORD
      data: '0'
      operation: add
      status: 'Blocking WOW64 telemetry node...'

  # DiagTrack AutoLogger kill
  - !registryValue:
      path: 'HKLM\SYSTEM\CurrentControlSet\Control\WMI\AutoLogger\AutoLogger-Diagtrack-Listener'
      value: 'Start'
      type: REG_DWORD
      data: '0'
      operation: add
      status: 'Killing DiagTrack AutoLogger...'

  # WER extra upload block
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting'
      value: 'DontSendAdditionalData'
      type: REG_DWORD
      data: '1'
      operation: add
      status: 'Blocking WER data uploads (supplemental key)...'

  # =========================================================
  # 2. PRIVACY — Input Personalization (Ink/Text Collection)
  # =========================================================
  - !registryValue:
      path: 'HKCU\SOFTWARE\Microsoft\InputPersonalization'
      value: 'RestrictImplicitTextCollection'
      type: REG_DWORD
      data: '1'
      operation: add
      status: 'Blocking implicit text collection...'

  - !registryValue:
      path: 'HKCU\SOFTWARE\Microsoft\InputPersonalization'
      value: 'RestrictImplicitInkCollection'
      type: REG_DWORD
      data: '1'
      operation: add
      status: 'Blocking implicit ink/handwriting collection...'

  - !registryValue:
      path: 'HKCU\SOFTWARE\Microsoft\InputPersonalization\TrainedDataStore'
      value: 'AcceptedPrivacyPolicy'
      type: REG_DWORD
      data: '0'
      operation: add
      status: 'Revoking input personalization privacy policy...'

  - !registryValue:
      path: 'HKCU\SOFTWARE\Microsoft\InputPersonalization\TrainedDataStore'
      value: 'HarvestContacts'
      type: REG_DWORD
      data: '0'
      operation: add
      status: 'Blocking contact harvesting for personalization...'

  - !registryValue:
      path: 'HKCU\SOFTWARE\Microsoft\Personalization\Settings'
      value: 'AcceptedPrivacyPolicy'
      type: REG_DWORD
      data: '0'
      operation: add
      status: 'Revoking personalization privacy policy...'

  # =========================================================
