      value: 'ShowRecentList'
      type: REG_DWORD
      data: '0'
      operation: add
      status: 'Hiding recent files list from Start...'

  # CDM extra key
  - !registryValue:
      path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
      value: 'SubscribedContent-338393Enabled'
      type: REG_DWORD
      data: '0'
      operation: add
      status: 'Blocking CDM settings suggestions...'

  # =========================================================
  # 9. PRIVACY — Device Metadata Network Block
  # =========================================================
  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Device Metadata'
      value: 'PreventDeviceMetadataFromNetwork'
      type: REG_DWORD
      data: '1'
      operation: add
      status: 'Blocking device metadata from network...'

  # =========================================================
  # 10. PRIVACY — Delivery Optimization (P2P Off)
  # =========================================================
  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\DeliveryOptimization\Config'
      value: 'DownloadMode'
      type: REG_DWORD
      data: '0'
      operation: add
      status: 'Disabling P2P Delivery Optimization...'

  # =========================================================
  # 11. PRIVACY — Game DVR (User Level)
  # =========================================================
  - !registryValue:
      path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\GameDVR'
      value: 'AppCaptureEnabled'
      type: REG_DWORD
      data: '0'
      operation: add
      status: 'Disabling Game DVR app capture (user)...'

  - !registryValue:
      path: 'HKCU\System\GameConfigStore'
      value: 'GameDVR_Enabled'
      type: REG_DWORD
      data: '0'
      operation: add
      status: 'Disabling Game DVR config store (user)...'

  - !registryValue:
      path: 'HKCU\Software\Microsoft\GameBar'
      value: 'UseNexusForGameBarEnabled'
      type: REG_DWORD
      data: '0'
      operation: add
      status: 'Disabling GameBar Nexus...'

  # =========================================================
  # 12. PRIVACY — Software Protection Platform
  # =========================================================
  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Software Protection Platform'
      value: 'NoGenTicket'
      type: REG_DWORD
      data: '1'
      operation: add
      status: 'Disabling SLP ticket generation...'

  # =========================================================
  # 13. SECURITY — Autorun & Autoplay (ALL Drives)
  # =========================================================
  - !registryValue:
      path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
      value: 'NoDriveTypeAutoRun'
      type: REG_DWORD
      data: '181'
      operation: add
      status: 'Disabling AutoRun on all drive types...'

  - !registryValue:
      path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\AutoplayHandlers'
      value: 'DisableAutoplay'
      type: REG_DWORD
      data: '1'
      operation: add
      status: 'Disabling AutoPlay...'

  - !registryValue:
      path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
      value: 'NoAutorun'
      type: REG_DWORD
      data: '1'
      operation: add
      status: 'Disabling AutoRun (user policy)...'

  # =========================================================
  # 14. SECURITY — Vulnerable Driver Blocklist
  # =========================================================
  - !registryValue:
      path: 'HKLM\SYSTEM\CurrentControlSet\Control\CI\Config'
      value: 'VulnerableDriverBlocklistEnable'
      type: REG_DWORD
      data: '1'
      operation: add
      status: 'Re-enabling Vulnerable Driver Blocklist...'

  # =========================================================
  # 15. AI / COPILOT — Full Policy Block (Windows AI / Recall)
  # =========================================================
  - !status: {status: 'Blocking all AI/Copilot features...'}

  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsCopilot'
      value: 'TurnOffWindowsCopilot'
      type: REG_DWORD
      data: '1'
      operation: add

  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsAI'
      value: 'DisableAIDataAnalysis'
      type: REG_DWORD
      data: '1'
      operation: add

  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsAI'
      value: 'AllowRecallEnablement'
      type: REG_DWORD
      data: '0'
      operation: add

  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsAI'
      value: 'DisableClickToDo'
      type: REG_DWORD
      data: '1'
      operation: add

  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsAI'
      value: 'TurnOffSavingSnapshots'
      type: REG_DWORD
      data: '1'
      operation: add

  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsAI'
      value: 'DisableSettingsAgent'
      type: REG_DWORD
      data: '1'
      operation: add

  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\Windows\Shell\Copilot'
      value: 'IsCopilotAvailable'
      type: REG_DWORD
      data: '0'
      operation: add

  - !registryValue:
      path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsCopilot'
      value: 'AllowCopilotRuntime'
      type: REG_DWORD
      data: '0'
      operation: add

  # AI consent store deny
  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\generativeAI'
      value: 'Value'
      type: REG_SZ
      data: 'Deny'
      operation: add
      status: 'Denying generative AI consent...'

  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy'
      value: 'LetAppsAccessGenerativeAI'
      type: REG_DWORD
      data: '2'
      operation: add

  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy'
      value: 'LetAppsAccessSystemAIModels'
      type: REG_DWORD
      data: '2'
      operation: add

  # Input insights
  - !registryValue:
      path: 'HKCU\Software\Microsoft\input\Settings'
      value: 'InsightsEnabled'
      type: REG_DWORD
      data: '0'
      operation: add
      status: 'Disabling input insights...'

  # =========================================================
  # 16. AI — Microsoft Edge Copilot/AI Policy Block
