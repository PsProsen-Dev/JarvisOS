      value: 'AllowSearchToUseLocation'
      type: REG_DWORD
      data: '0'
      operation: add
      status: 'Blocking location in user search...'

  - !registryValue:
      path: 'HKCU\SOFTWARE\Policies\Microsoft\Windows\Explorer'
      value: 'DisableSearchBoxSuggestions'
      type: REG_DWORD
      data: '1'
      operation: add
      status: 'Disabling search box suggestions...'

  # =========================================================
  # 4. PRIVACY — Voice & Speech Activation
  # =========================================================
  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\Speech_OneCore\Preferences'
